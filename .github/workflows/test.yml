name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 24.04 ships gjs 1.80, the same as GNOME 46
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install gjs, GTK 4 and libadwaita
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gjs gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gir1.2-adw-1 libglib2.0-bin
          gsettings-desktop-schemas xvfb xauth

      - name: Smoke tests (covers and preferences)
        run: xvfb-run -a npm run smoke
